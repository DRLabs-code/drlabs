name: Daily desk

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-desk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write two notes and rebuild
        env:
          DRLABS_ROOT: ${{ github.workspace }}
          ASTRO_GEN: ""
          ASTRO_CONTENT: ""
        run: |
          python3 scripts/daily_desk.py
          python3 scripts/i18n_build.py

      - name: Commit if the desk wrote anything
        run: |
          git config user.name "DRLabs desk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes."
            exit 0
          fi
          git commit -m "desk: daily notes $(date -u +%F)"
          git push
